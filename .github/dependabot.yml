version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: ["Dependencies"]

updates:
  - package-ecosystem: composer
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    versioning-strategy: increase
    allow:
      - dependency-type: all

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
